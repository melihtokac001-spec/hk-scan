<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cleaning Scan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"><div class="card"><div class="spinner"></div></div></main>
<script src="config.js"></script>
<script src="hk.js"></script>
<script>
(function () {
  var cfg = window.HK_CONFIG, app = document.getElementById("app"), esc = HK.esc;
  var area = (HK.param("a") || "").trim().toUpperCase();
  var action = (HK.param("t") || "").trim().toUpperCase();

  function show(html) { app.innerHTML = html; }
  function fail(title, text) {
    show('<div class="card"><span class="badge warn">' + esc(title) + '</span>' +
         '<p class="msg">' + text + '</p></div>');
  }

  if (!/^[A-Z0-9-]{2,24}$/.test(area) || (action !== "IN" && action !== "OUT")) {
    return fail("Invalid QR", "This QR code is not valid. Please tell your supervisor.");
  }

  var staff = HK.getStaff();
  if (!staff) {
    return fail("Not registered", "This phone is not registered yet.<br><br>" +
      "Scan your <b>personal setup card</b> once (ask your supervisor), then scan this QR again.");
  }
  if (!/^https:\/\//.test(cfg.SCAN_URL)) {
    return fail("Setup error", "The scan link in config.js is missing. Please tell your supervisor.");
  }

  var cls = action === "IN" ? "in" : "out";
  var who = '<div class="who">' + esc(staff.name) + '</div>';

  function send() {
    show('<div class="card"><span class="badge ' + cls + '">' + action + '</span>' +
         '<div class="area">' + esc(area) + '</div>' + who + '<div class="spinner"></div></div>');
    fetch(cfg.SCAN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ area: area, action: action, staff: staff.id + "|" + staff.key + "|" + staff.name })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      HK.setLastScan(area, action);
      show('<div class="card"><div class="done ' + cls + '">&#10004;</div>' +
           '<div class="area">Done</div>' +
           '<span class="badge ' + cls + '">' + action + '</span>' +
           '<div class="area">' + esc(area) + '</div>' + who + '</div>' +
           '<p class="small">You can close this page.</p>');
    }).catch(function () {
      show('<div class="card"><span class="badge warn">Not sent</span>' +
           '<p class="msg">No internet connection. Move to Wi-Fi coverage and try again.</p></div>' +
           '<button class="btn" id="retry">Try again</button>');
      document.getElementById("retry").onclick = send;
    });
  }

  // Guard against accidental double scans of the same code
  var last = HK.getLastScan();
  var ago = last ? Math.round((Date.now() - last.ts) / 1000) : Infinity;
  if (last && last.area === area && last.action === action && ago < cfg.REPEAT_WARNING_SECONDS) {
    show('<div class="card"><span class="badge warn">Already scanned</span>' +
         '<div class="area">' + esc(area) + ' &middot; ' + action + '</div>' + who +
         '<p class="msg">You scanned this ' + ago + ' seconds ago.</p></div>' +
         '<button class="btn" id="again">Record again</button>');
    document.getElementById("again").onclick = send;
    return;
  }
  send();
})();
</script>
</body>
</html>
